<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Сафия Тетрис</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Заголовок — компактный */
  .header {
    text-align: center;
    padding: 6px 10px;
    flex-shrink: 0;
    background: linear-gradient(90deg, #1a0a2e, #2d1b69, #1a0a2e);
    border-bottom: 2px solid #3d2b7a;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Основная область игры */
  .game-area {
    flex: 1;
    display: flex;
    gap: 6px;
    padding: 6px;
    min-height: 0;
    overflow: hidden;
  }

  /* Игровое поле */
  .board-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-width: 0;
  }
  .board-container {
    background: #0f0f1e;
    border: 2px solid #2d1b69;
    border-radius: 8px;
    padding: 3px;
    box-shadow: 0 0 20px rgba(100, 50, 200, 0.3);
    height: 100%;
    display: flex;
    align-items: center;
  }
  #game-board {
    display: grid;
    gap: 1px;
    background: #050510;
    border-radius: 4px;
    overflow: hidden;
    height: 100%;
  }
  .cell {
    background: #0f0f1e;
    border-radius: 1px;
  }
  .cell.filled {
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.2);
  }
  .cell.I { background: #00f0f0; }
  .cell.O { background: #f0f000; }
  .cell.T { background: #a000f0; }
  .cell.S { background: #00f000; }
  .cell.Z { background: #f00000; }
  .cell.J { background: #0000f0; }
  .cell.L { background: #f0a000; }

  /* Боковая панель */
  .side-panel {
    width: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .info-box {
    background: #1a1a2e;
    border: 1px solid #2d1b69;
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .info-label {
    color: #8e8e93;
    font-size: 10px;
    margin-bottom: 2px;
  }
  .info-value {
    font-size: 18px;
    font-weight: bold;
    color: #feca57;
  }
  #next-piece {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 1px;
    background: #050510;
    padding: 3px;
    border-radius: 4px;
    flex: 1;
  }
  .next-cell {
    background: #1a1a2e;
    border-radius: 1px;
  }
  .next-cell.filled {
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  /* Кнопки управления */
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 6px;
    flex-shrink: 0;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
  }
  .ctrl-btn {
    height: 56px;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: #1a1a2e;
    border: 2px solid #2d1b69;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:active { transform: scale(0.95); background: #2d1b69; }
  .ctrl-btn.rotate { background: #e94560; border-color: #c23651; font-size: 26px; }
  .ctrl-btn.drop { background: #533483; border-color: #3d2660; }

  /* Оверлеи */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    z-index: 10;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 26px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay p {
    font-size: 16px;
    margin-bottom: 15px;
    color: #8e8e93;
    text-align: center;
  }
  .overlay button {
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: #e94560;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .overlay button:active { transform: scale(0.95); }

  /* Адаптация под маленькие экраны */
  @media (max-height: 600px) {
    .header { padding: 4px 10px; }
    .title { font-size: 16px; }
    .ctrl-btn { height: 48px; font-size: 18px; }
    .info-value { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">🎮 Сафия Тетрис</div>
</div>

<div class="game-area">
  <div class="board-wrapper">
    <div class="board-container">
      <div id="game-board"></div>
      <div class="overlay hidden" id="start-overlay">
        <h2>Сафия Тетрис</h2>
        <p>Нажмите чтобы начать игру</p>
        <button onclick="startGame()">▶ Играть</button>
      </div>
      <div class="overlay hidden" id="gameover-overlay">
        <h2>Игра окончена</h2>
        <p>Счёт: <span id="final-score">0</span></p>
        <button onclick="restartGame()"> Заново</button>
      </div>
      <div class="overlay hidden" id="pause-overlay">
        <h2> Пауза</h2>
        <button onclick="togglePause()">▶ Продолжить</button>
      </div>
    </div>
  </div>

  <div class="side-panel">
    <div class="info-box">
      <div class="info-label">Счёт</div>
      <div class="info-value" id="score">0</div>
    </div>
    <div class="info-box">
      <div class="info-label">Линии</div>
      <div class="info-value" id="lines">0</div>
    </div>
    <div class="info-box">
      <div class="info-label">Уровень</div>
      <div class="info-value" id="level">1</div>
    </div>
    <div class="info-box">
      <div class="info-label">След.</div>
      <div id="next-piece"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="moveLeft()">←</button>
  <button class="ctrl-btn rotate" onclick="rotatePiece()">↻</button>
  <button class="ctrl-btn" onclick="moveRight()">→</button>
  <button class="ctrl-btn" onclick="moveDown()">↓</button>
  <button class="ctrl-btn drop" onclick="hardDrop()">⤓</button>
  <button class="ctrl-btn" onclick="togglePause()"></button>
</div>

<script>
  const COLS = 10;
  const ROWS = 20;
  const board = [];
  let currentPiece = null;
  let nextPieceType = null;
  let score = 0;
  let lines = 0;
  let level = 1;
  let gameInterval = null;
  let isPlaying = false;
  let isPaused = false;
  let cellSize = 30;

  const PIECES = {
    I: { shape: [[1,1,1,1]], color: 'I' },
    O: { shape: [[1,1],[1,1]], color: 'O' },
    T: { shape: [[0,1,0],[1,1,1]], color: 'T' },
    S: { shape: [[0,1,1],[1,1,0]], color: 'S' },
    Z: { shape: [[1,1,0],[0,1,1]], color: 'Z' },
    J: { shape: [[1,0,0],[1,1,1]], color: 'J' },
    L: { shape: [[0,0,1],[1,1,1]], color: 'L' }
  };
  const PIECE_NAMES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

  function calculateCellSize() {
    const boardWrapper = document.querySelector('.board-wrapper');
    const sidePanel = document.querySelector('.side-panel');
    const controls = document.querySelector('.controls');
    const header = document.querySelector('.header');

    const availHeight = window.innerHeight - header.offsetHeight - controls.offsetHeight - 20;
    const availWidth = window.innerWidth - sidePanel.offsetWidth - 20;

    const sizeByHeight = Math.floor((availHeight - 6) / ROWS);
    const sizeByWidth = Math.floor((availWidth - 6) / COLS);
    cellSize = Math.min(sizeByHeight, sizeByWidth, 35);
    cellSize = Math.max(cellSize, 15);
  }

  function initBoard() {
    calculateCellSize();
    const boardEl = document.getElementById('game-board');
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
    boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;

    for (let r = 0; r < ROWS; r++) {
      board[r] = [];
      for (let c = 0; c < COLS; c++) {
        board[r][c] = 0;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${r}-${c}`;
        cell.style.width = cellSize + 'px';
        cell.style.height = cellSize + 'px';
        boardEl.appendChild(cell);
      }
    }
  }

  function initNextPiece() {
    const nextEl = document.getElementById('next-piece');
    nextEl.innerHTML = '';
    const nextCellSize = Math.max(Math.floor(cellSize * 0.6), 10);
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div');
        cell.className = 'next-cell';
        cell.id = `next-${r}-${c}`;
        cell.style.width = nextCellSize + 'px';
        cell.style.height = nextCellSize + 'px';
        nextEl.appendChild(cell);
      }
    }
  }

  function randomPiece() {
    const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
    return {
      type: name,
      shape: PIECES[name].shape.map(row => [...row]),
      color: PIECES[name].color,
      row: 0,
      col: Math.floor((COLS - PIECES[name].shape[0].length) / 2)
    };
  }

  function drawBoard() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.getElementById(`cell-${r}-${c}`);
        cell.className = 'cell';
        if (board[r][c]) {
          cell.classList.add('filled', board[r][c]);
        }
      }
    }
  }

  function drawPiece() {
    if (!currentPiece) return;
    const shape = currentPiece.shape;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const cell = document.getElementById(`cell-${currentPiece.row + r}-${currentPiece.col + c}`);
          if (cell) {
            cell.classList.add('filled', currentPiece.color);
          }
        }
      }
    }
  }

  function drawNextPiece() {
    const nextEl = document.getElementById('next-piece');
    const cells = nextEl.querySelectorAll('.next-cell');
    cells.forEach(cell => { cell.className = 'next-cell'; });

    if (!nextPieceType) return;
    const piece = PIECES[nextPieceType];
    const shape = piece.shape;
    const offsetR = Math.floor((4 - shape.length) / 2);
    const offsetC = Math.floor((4 - shape[0].length) / 2);

    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const cell = document.getElementById(`next-${r + offsetR}-${c + offsetC}`);
          if (cell) {
            cell.classList.add('filled', piece.color);
          }
        }
      }
    }
  }

  function isValidMove(piece, newRow, newCol, newShape) {
    const shape = newShape || piece.shape;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const newR = newRow + r;
          const newC = newCol + c;
          if (newR < 0 || newR >= ROWS || newC < 0 || newC >= COLS) return false;
          if (board[newR][newC]) return false;
        }
      }
    }
    return true;
  }

  function lockPiece() {
    const shape = currentPiece.shape;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const boardR = currentPiece.row + r;
          const boardC = currentPiece.col + c;
          if (boardR < 0) {
            gameOver();
            return;
          }
          board[boardR][boardC] = currentPiece.color;
        }
      }
    }
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let linesCleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(cell => cell !== 0)) {
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(0));
        linesCleared++;
        r++;
      }
    }
    if (linesCleared > 0) {
      lines += linesCleared;
      const points = [0, 100, 300, 500, 800];
      score += (points[linesCleared] || 800) * level;
      level = Math.floor(lines / 10) + 1;
      updateScore();
      drawBoard();
      changeSpeed();
    }
  }

  function updateScore() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }

  function spawnPiece() {
    currentPiece = {
      type: nextPieceType || PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)],
      shape: [],
      color: '',
      row: 0,
      col: 0
    };
    const pieceData = PIECES[currentPiece.type];
    currentPiece.shape = pieceData.shape.map(row => [...row]);
    currentPiece.color = pieceData.color;
    currentPiece.col = Math.floor((COLS - pieceData.shape[0].length) / 2);

    nextPieceType = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
    drawNextPiece();

    if (!isValidMove(currentPiece, currentPiece.row, currentPiece.col)) {
      gameOver();
    }
  }

  function moveDown() {
    if (!isPlaying || isPaused) return;
    if (isValidMove(currentPiece, currentPiece.row + 1, currentPiece.col)) {
      currentPiece.row++;
      drawBoard();
      drawPiece();
    } else {
      lockPiece();
    }
  }

  function moveLeft() {
    if (!isPlaying || isPaused) return;
    if (isValidMove(currentPiece, currentPiece.row, currentPiece.col - 1)) {
      currentPiece.col--;
      drawBoard();
      drawPiece();
    }
  }

  function moveRight() {
    if (!isPlaying || isPaused) return;
    if (isValidMove(currentPiece, currentPiece.row, currentPiece.col + 1)) {
      currentPiece.col++;
      drawBoard();
      drawPiece();
    }
  }

  function rotatePiece() {
    if (!isPlaying || isPaused) return;
    const shape = currentPiece.shape;
    const rows = shape.length;
    const cols = shape[0].length;
    const newShape = [];
    for (let c = 0; c < cols; c++) {
      newShape[c] = [];
      for (let r = rows - 1; r >= 0; r--) {
        newShape[c].push(shape[r][c]);
      }
    }
    if (isValidMove(currentPiece, currentPiece.row, currentPiece.col, newShape)) {
      currentPiece.shape = newShape;
      drawBoard();
      drawPiece();
    }
  }

  function hardDrop() {
    if (!isPlaying || isPaused) return;
    while (isValidMove(currentPiece, currentPiece.row + 1, currentPiece.col)) {
      currentPiece.row++;
      score += 2;
    }
    updateScore();
    lockPiece();
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    document.getElementById('pause-overlay').classList.toggle('hidden', !isPaused);
    if (isPaused) {
      clearInterval(gameInterval);
    } else {
      gameInterval = setInterval(moveDown, getSpeed());
    }
  }

  function getSpeed() {
    // Начальная скорость 500мс, уменьшается с уровнем, минимум 100мс
    return Math.max(100, 500 - (level - 1) * 40);
  }

  function changeSpeed() {
    if (gameInterval) {
      clearInterval(gameInterval);
      gameInterval = setInterval(moveDown, getSpeed());
    }
  }

  function gameOver() {
    isPlaying = false;
    clearInterval(gameInterval);
    document.getElementById('final-score').textContent = score;
    document.getElementById('gameover-overlay').classList.remove('hidden');
  }

  function startGame() {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('gameover-overlay').classList.add('hidden');
    initBoard();
    initNextPiece();
    score = 0;
    lines = 0;
    level = 1;
    updateScore();
    nextPieceType = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
    spawnPiece();
    drawBoard();
    drawPiece();
    isPlaying = true;
    isPaused = false;
    gameInterval = setInterval(moveDown, getSpeed());
  }

  function restartGame() {
    startGame();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') moveLeft();
    else if (e.key === 'ArrowRight') moveRight();
    else if (e.key === 'ArrowDown') moveDown();
    else if (e.key === 'ArrowUp') rotatePiece();
    else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
    else if (e.key === 'p' || e.key === 'P') togglePause();
  });

  // Предотвращение скролла на мобильных
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

  window.addEventListener('resize', () => {
    if (isPlaying) {
      initBoard();
      drawBoard();
      drawPiece();
    }
  });

  initBoard();
  initNextPiece();
  document.getElementById('start-overlay').classList.remove('hidden');
</script>

</body>
</html>
